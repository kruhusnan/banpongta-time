<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ระบบลงเวลาโรงเรียนบ้านปงตา</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
:root{
  --pink:#e91e63;--pink-dark:#c2185b;
  --pink-light:#fce4ec;--text:#334155;
  --muted:#78909c;--border:#e2e8f0;
  --shadow:0 10px 30px rgba(194,24,91,.12)
}
*{box-sizing:border-box}
body{
  margin:0;padding:16px;min-height:100vh;
  background:linear-gradient(145deg,#fff1f5,#f8bbd0);
  font-family:'Kanit',sans-serif;color:var(--text);
  display:flex;justify-content:center;align-items:flex-start;
  -webkit-tap-highlight-color:transparent
}
button,input,select{font-family:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.hidden{display:none!important}
.app{
  width:100%;max-width:490px;background:white;
  border-radius:24px;overflow:hidden;
  box-shadow:var(--shadow);min-height:500px;
  position:relative
}
.header{
  background:linear-gradient(135deg,#ad1457,#e91e63,#f06292);
  color:white;text-align:center;
  padding:24px 16px 37px;border-radius:0 0 26px 26px;
  position:relative
}
.admin-enroll-btn{
  position:absolute;top:14px;right:14px;
  background:rgba(255,255,255,.18);color:white;
  border:1px solid rgba(255,255,255,.35);
  border-radius:20px;padding:5px 10px;
  font-size:11px;display:flex;align-items:center;gap:4px
}
.admin-enroll-btn .material-icons-round{font-size:16px}
.brand-icon{
  width:68px;height:68px;border-radius:50%;
  background:white;padding:6px;
  margin:0 auto 10px;display:flex;
  align-items:center;justify-content:center
}
.brand-icon .material-icons-round{font-size:30px;color:#c2185b}
.header h1{font-size:22px;margin:0;font-weight:600}
.header p{font-size:13px;margin:4px 0 0;opacity:.94;font-weight:300}
.tabs{
  display:flex;gap:6px;background:white;border-radius:50px;
  margin:-22px 22px 22px;padding:5px;
  position:relative;box-shadow:0 5px 18px rgba(0,0,0,.12)
}
.tab{
  flex:1;display:flex;align-items:center;
  justify-content:center;gap:6px;padding:11px 8px;
  border:0;border-radius:40px;background:transparent;
  color:#64748b;font-size:14px
}
.tab .material-icons-round{font-size:19px}
.tab.active{
  color:white;background:linear-gradient(135deg,#e91e63,#ad1457);
  box-shadow:0 4px 12px rgba(233,30,99,.25)
}
main{padding:0 20px 10px}
.section-head{margin-bottom:18px}
.section-head h2{font-size:18px;font-weight:600;margin:0}
.section-head p{font-size:12px;color:var(--muted);margin:3px 0 0}
label{display:block;font-size:14px;font-weight:500;margin:0 0 8px}
.input-box{
  display:flex;align-items:center;gap:9px;
  border:1px solid var(--border);
  background:#f8fafc;border-radius:13px;
  padding:0 12px;margin-bottom:16px;
  transition:border-color .2s,box-shadow .2s
}
.input-box:focus-within{
  border-color:var(--pink);
  box-shadow:0 0 0 3px rgba(233,30,99,.08);
  background:white
}
.input-box .material-icons-round{color:#db2777;font-size:21px}
.input-box input,.input-box select{
  width:100%;min-width:0;padding:13px 0;
  border:0;outline:0;background:transparent;
  font-size:14px;color:var(--text)
}
.position-box{
  display:flex;gap:6px;align-items:center;
  margin:-5px 0 18px;color:#64748b;font-size:12px
}
.position-box .material-icons-round{font-size:17px;color:var(--pink)}
.position-box strong{color:#be185d;font-weight:500}
.status-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;margin:0 0 20px
}
.status-choice{margin:0;cursor:pointer}
.status-choice input{position:absolute;opacity:0;width:1px;height:1px}
.status-content{
  border:1px solid #e5e7eb;border-radius:13px;
  min-height:83px;display:flex;flex-direction:column;
  gap:5px;align-items:center;justify-content:center;
  padding:8px 3px;text-align:center;font-size:12px;
  background:white;transition:.2s
}
.status-content .material-icons-round{font-size:24px}
.present .status-content{color:#15803d;background:#f0fdf4;border-color:#bbf7d0}
